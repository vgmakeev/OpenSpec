name: flutter-app
version: 1
description: Standard OpenSpec workflow for standalone Flutter applications without mini
artifacts:
  - id: proposal
    generates: proposal.md
    description: Change intent, outcomes, scope, capabilities, and Flutter impact
    template: proposal.md
    instruction: |
      Create a concise proposal that establishes WHY the change is needed and
      draws its product/system boundary. Implementation belongs in design.md.

      Sections:
      - **Why**: The problem or opportunity and why now.
      - **Desired Outcomes**: Observable user, business, support, or system outcomes and success signals.
      - **What Changes**: Specific additions, modifications, or removals. Mark breaking changes with **BREAKING**.
      - **Capabilities**: New and modified capability paths. Each path creates a matching delta spec; preserve exact existing paths and use kebab-case for new segments.
      - **Scope**: Included behavior and explicit non-goals.
      - **Impact**: Affected user journeys, platforms, navigation, local/remote data, APIs, releases, analytics, accessibility, localization, rollout, and dependencies.

      Every behavior-changing change declares at least one capability. Use
      `skip_specs: true` only for a pure refactor, tooling, or documentation
      change with no behavior change. Keep the proposal to 1-2 pages.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Durable product and application contracts for Flutter capabilities
    template: spec.md
    instruction: |
      Define WHAT the capability guarantees. Scenarios demonstrate a
      requirement; they do not replace its normative contract.

      Requirement kinds:
      - `acceptance` - a binary, observable condition for accepting the capability;
      - `invariant` - a domain, authorization, consistency, privacy, or safety rule;
      - `state` - lifecycle states, transitions, guards, and visible side effects;
      - `contract` - a UI, navigation, API, local storage, platform, event, or file boundary;
      - `workflow` - ordered behavior across screens, components, or time;
      - `quality` - performance, reliability, accessibility, compatibility, privacy, or operability.

      Each requirement must include:
      - `Kind`, affected `Surfaces`, and accountable product/domain `Owner`;
      - one normative SHALL/MUST statement;
      - structured detail when states, inputs/outputs/errors, permissions,
        offline/sync behavior, limits, or compatibility would otherwise be ambiguous;
      - at least one exact `#### Scenario:` with WHEN/THEN, including failure
        and boundary cases when they change the contract.

      Every behavior-changing change adds or modifies at least one
      `Kind: acceptance` requirement. Stable `AC-<capability>-<number>` IDs are
      optional and should be used only when tests, releases, repositories, or
      external documents need to cite the criterion. Do not create an ID
      taxonomy merely for traceability tooling.

      Surfaces may include `android`, `ios`, `web`, `desktop`, `ui`, `api`,
      `storage`, `sync`, and `platform`. Describe observable boundaries, not
      widgets, classes, packages, or implementation steps.

      Use exact delta headings:
      - `## ADDED Requirements`
      - `## MODIFIED Requirements` with the complete updated requirement block
      - `## REMOVED Requirements` with **Reason** and **Migration**
      - `## RENAMED Requirements` with FROM/TO only

      Each requirement uses `### Requirement: <name>` and every scenario uses
      exactly four hashes. New capabilities include a `## Purpose` of at least
      50 characters. Existing capability deltas omit Purpose. For MODIFIED
      requirements copy the entire existing block through all scenarios from
      `<planningHome.root>/openspec/specs/<capability-path>/spec.md`; partial
      blocks lose durable detail at archive time.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Flutter application design and platform delivery decisions
    template: design.md
    instruction: |
      Explain HOW to implement the change. Include design.md for cross-cutting
      changes, new architecture or dependencies, significant state/data/API or
      platform work, security/performance/release complexity, or ambiguity that
      benefits from decisions before coding.

      Sections:
      - **Context** and **Goals / Non-Goals**: Only implementation constraints and boundaries not already covered by proposal.
      - **Flutter App Coverage**: Keep affected rows only and map requirements to the smallest owning layer and verification seam.
      - **Domain And State Model**: Domain rules, state ownership, lifecycle, transitions, persistence, and restoration when affected.
      - **Experience And Navigation**: Screens, navigation/deep links, loading/empty/error states, accessibility, localization, and adaptive layout when affected.
      - **Data And External Contracts**: APIs, auth/session, storage, offline/sync/conflicts, caching, serialization, and errors when affected.
      - **Platform And Delivery**: Platform channels, permissions, notifications, background execution, flavors, signing, rollout, migration, and compatibility when affected.
      - **Decisions**, **Risks / Trade-offs**, **Migration Plan**, and only deferrable **Open Questions**.

      Keep domain decisions independent of widgets and platform adapters. State
      who owns server truth, local truth, conflict resolution, retries, and
      user-visible failure. Do not invent a repository pattern or state library
      when the project's existing convention is sufficient. Delete unused rows
      and sections. Resolve questions that would change requirements, approach,
      or task breakdown before writing tasks.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Flutter implementation steps and conditional Definition of Done
    template: tasks.md
    instruction: |
      Create small dependency-ordered tasks using exact `- [ ] X.Y` syntax.
      Every task states its verification: test, command, observable behavior,
      or delivered artifact. Reference specs for what and design for how.

      Finish with a compact conditional Definition of Done covering:
      - `openspec validate <change> --strict`;
      - evidence for every acceptance criterion in scope;
      - focused unit, widget, integration, or golden tests for affected behavior;
      - `flutter analyze` and the project's formatter/lint command;
      - affected platform builds, API/storage compatibility, accessibility,
        localization, analytics, rollout/rollback, and documentation only when applicable.

      Flutter tooling validates implementation and builds, not requirement
      prose. It does not replace behavioral tests or acceptance evidence;
      OpenSpec validates its own artifacts.
    requires:
      - specs
      - design

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Read context files, work through pending tasks, mark complete as you go.
    Pause if you hit blockers or need clarification.
